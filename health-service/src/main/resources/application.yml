spring:
  application:
    name: health-service

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:healthpulse
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  batch:
    job:
      enabled: false # jobs are launched explicitly by the scheduler, not on every app boot
    jdbc:
      initialize-schema: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: health-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: "*"

  # Kafka is required for event-driven updates
  # Do NOT exclude Kafka auto-configuration

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: false
      discovery:
        prefer-ip-address: true
        service-name: health-service
        instance-id: health-service-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true
        port: ${server.port:8082}
    openfeign:
      client:
        config:
          default:
            logger-level: full
      okhttp:
        enabled: true
      circuitbreaker:
        enabled: true
        group:
          enabled: true

  # Feign Client Configuration
  # Consul service discovery handles URL resolution; no hardcoded URLs needed
feign:
  compression:
    request:
      enabled: true
      min-request-size: 1024
    response:
      enabled: true

# Resilience4j Circuit Breaker Configuration
# Protects health-service from cascading failures when plant-service is unavailable
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        recordExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
        ignoreExceptions:
          - feign.FeignException$NotFound
    instances:
      plant-service:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 30000    # 30 seconds
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000   # 2 seconds

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# AsyncAPI / Springwolf Configuration for Kafka Events Documentation
springwolf:
  enabled: true
  docket:
    base-package: com.plantpulse.healthservice
    info:
      title: Health Service Events
      version: 1.0.0
      description: AsyncAPI documentation for Kafka events published by Health Service
      contact:
        name: PlantPulse Team
    servers:
      kafka:
        protocol: kafka
        host: ${spring.kafka.bootstrap-servers}

plantpulse:
  jwt:
    # Must match plant-service's signing secret: both services trust the same
    # tokens, but health-service only ever *reads* the userId claim — it never
    # issues tokens itself.
    secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-please-change-this-in-production-for-security}
  health:
    # Care & health-intelligence tuning knobs
    reminder-cron: ${REMINDER_CRON:0 0 8 * * *}          # daily 08:00 - watering reminders
    decay-cron: ${DECAY_CRON:0 15 2 * * *}                # daily 02:15 - health-score upkeep for stale plants
    outbreak-sweep-cron: ${OUTBREAK_SWEEP_CRON:0 */30 * * * *} # every 30 min - regional outbreak sweep
    outbreak-window-days: 7
    outbreak-min-affected-plants: 3
    outbreak-min-match-percentage: 55
    decay-grace-period-days: 5
    decay-points-per-day: 2
