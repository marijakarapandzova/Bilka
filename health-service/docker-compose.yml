networks:
  shared_net:
    name: bilka_shared_net
    external: true

services:
  # Health Service App (uses H2 in-memory database, Kafka from plant-service)
  health-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health_service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-this-is-a-very-long-development-only-secret-key-please-change-this-in-production-for-security}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_CLOUD_CONSUL_HOST: host.docker.internal
      SPRING_CLOUD_CONSUL_PORT: 8500
    volumes:
      - ../Indoor_Plant_Health_and_Growth_Factors.csv:/app/Indoor_Plant_Health_and_Growth_Factors.csv
    networks:
      - shared_net
