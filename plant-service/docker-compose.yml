version: "3.8"

networks:
  plantpulse_services_net:
    name: plantpulse_services_net
    driver: bridge
  shared_net:
    name: bilka_shared_net
    driver: bridge

volumes:
  postgres-data:

services:
  # Kafka Broker
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consul is already running as consul_gateway in shared network

  postgres:
    image: postgres:16
    container_name: plantpulse-postgres
    environment:
      POSTGRES_DB: plantpulse
      POSTGRES_USER: plantpulse
      POSTGRES_PASSWORD: plantpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - plantpulse_services_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  plant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plant_service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plantpulse
      SPRING_DATASOURCE_USERNAME: plantpulse
      SPRING_DATASOURCE_PASSWORD: plantpulse
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_CLOUD_CONSUL_HOST: host.docker.internal
      SPRING_CLOUD_CONSUL_PORT: 8500
    networks:
      - plantpulse_services_net
      - shared_net
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
