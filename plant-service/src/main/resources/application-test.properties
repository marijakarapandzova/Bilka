# Application Test Profile
# Activated by @ActiveProfiles("test") in Pact provider tests
# This profile disables external dependencies (PostgreSQL, Consul, Kafka, Keycloak)
# and uses in-memory H2 database instead

# ============================================================
# Database: H2 in-memory (no external PostgreSQL needed)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: auto-create and drop schema for each test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Disable Axon Server (use embedded mode)
# ============================================================
# Pact tests don't need event sourcing; keeping it simple
axon.axonserver.enabled=false

# ============================================================
# Disable Consul Service Discovery
# ============================================================
# Pact provider tests don't need Consul running
# The test will boot the app on a random port and doesn't register it
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false

# ============================================================
# Disable Spring Cloud Bus
# ============================================================
# Consul-all transitively pulls in Spring Cloud Bus
# Bus requires a message binder (RabbitMQ or Kafka)
# We don't have either in the test profile, so disable it
spring.cloud.bus.enabled=false

# ============================================================
# Disable Kafka
# ============================================================
# In real app, we publish events to Kafka
# For Pact provider tests (message verification), we use @PactVerifyProvider
# which doesn't start a Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=plant-service-test

# ============================================================
# Security: Disable OAuth2 Resource Server Auto-Config
# ============================================================
# In production, SecurityConfig validates JWT from Keycloak
# For Pact tests, we add TestSecurityConfig with @Profile("test")
# that permits all requests (no auth required)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# ============================================================
# Logging: Reduce noise from Spring/Hibernate
# ============================================================
logging.level.root=WARN
logging.level.com.plantpulse=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
