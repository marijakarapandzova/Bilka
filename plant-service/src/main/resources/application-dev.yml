spring:
  application:
    name: plant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/plantpulse
    username: plantpulse
    password: plantpulse
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: plant-service-group
      auto-offset-reset: earliest

  cloud:
    consul:
      enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.plantpulse.plantservice.infrastructure.messaging: DEBUG
    org.springframework.kafka: INFO

plantpulse:
  jwt:
    secret: this-is-a-very-long-development-only-secret-key-change-me-32chars
    expiration-ms: 86400000
  trefle:
    api-key: ""
    base-url: https://trefle.io/api/v1
  plantid:
    api-key: ""
    api-url: https://api.plant.id/v2/identify