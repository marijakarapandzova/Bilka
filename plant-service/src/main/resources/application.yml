

spring:
  application:
    name: plant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/plantpulse
    username: plantpulse
    password: plantpulse
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: plant-service-group
      auto-offset-reset: earliest

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: false
      discovery:
        prefer-ip-address: true
        service-name: plant-service
        instance-id: plant-service-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true
        port: ${server.port:8081}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# AsyncAPI / Springwolf Configuration for Kafka Events Documentation
springwolf:
  enabled: true
  docket:
    base-package: com.plantpulse.plantservice
    info:
      title: Plant Service Events
      version: 1.0.0
      description: AsyncAPI documentation for Kafka events published by Plant Service
      contact:
        name: PlantPulse Team
    servers:
      kafka:
        protocol: kafka
        host: ${spring.kafka.bootstrap-servers}

plantpulse:
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-please-change-this-in-production-for-security}
    expiration-ms: 86400000
  trefle:
    api-key: ${TREFLE_API_KEY:usr-XPP5iku8GPiy70azS6yfC9wEFzneWewbvKPnsvzuH9o}
    base-url: https://trefle.io/api/v1
  perenual:
    api-key: ${PERENUAL_API_KEY:sk-hXZO6a52a40a4a23218726}
  plantid:
    api-key: ${PLANT_ID_API_KEY:}
    api-url: https://api.plant.id/v2/identify
